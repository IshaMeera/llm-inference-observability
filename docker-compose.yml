version: "3.9"

services:

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    volumes:
    - ./frontend:/app
    - /app/node_modules

    command: npm run dev

    env_file:
      - ./frontend/.env

    depends_on:
      - chatbot

  chatbot:

    build:
      context: ./chatbot-service

    ports:
      - "5000:5000"

    env_file:
      - ./chatbot-service/.env

    depends_on:
      - ingestion
      - mongo

  ingestion:

    build:
      context: ./ingestion-service

    ports:
      - "5001:5001"

    env_file:
      - ./ingestion-service/.env

    depends_on:
      - mongo

  mongo:

    image: mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db


volumes:

  mongo-data: